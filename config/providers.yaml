# ============================================================================
# PUNTO AI ENGINE - PROVEEDORES, TRANSPORTES Y ROLES (SUBSCRIPTION TRANSPORTS v0)
# ============================================================================
# Este fichero declara CUATRO cosas y nada mas:
#
#   providers: que adaptadores estan habilitados y con que modelo.
#   transport: por donde habla cada proveedor (codex, claude_code, api, existing).
#   auth_mode: como se autoriza ese transporte (chatgpt, claude_account, api_key).
#   roles:     que proveedor atiende cada rol de orquestacion.
#
# Modelo = configuracion. Proveedor = adaptador. Transporte = camino. Rol = asignacion.
# Cambiar cualquiera de los cuatro NO requiere tocar el motor.
#
# SIN FALLBACK IMPLICITO: si el transporte de suscripcion agota su limite o falla, la peticion
# vuelve con su fallo normalizado. NO se cambia a la API de pago por iniciativa del motor; eso
# podria generar cargos, asi que es una decision de configuracion explicita.
#
# FAILOVER EXPLICITO (seccion `failover`, mas abajo): es la unica excepcion y solo existe si este
# fichero la declara. Un rol con failover puede continuar con OTRO proveedor cuando el primario no
# esta operativo de forma demostrable (creditos/cuota, limite de tasa, proveedor no disponible o sin
# sesion) y el sustituto esta CONNECTED con las capacidades EFECTIVAS del rol. El sustituto hace el
# mismo trabajo del mismo rol y NO hereda autoridad: Human Gates, Authority Envelope, alcance y
# verificaciones no cambian. Un error del proyecto o una respuesta incorrecta del proveedor NO
# dispara failover. El primario sigue siendo la asignacion de `roles` y vuelve a responder en cuanto
# se recupera. `allow_metered: false` impide sustitutos de pago por uso (API con clave).
#
# CREDENCIALES: no viven aqui. La sesion de Codex y la de Claude Code las administran sus propios
# clientes oficiales (`codex login`, `claude auth login`); la API lee su clave del entorno
# (OPENAI_API_KEY, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY). Nada de eso se escribe en este fichero, ni
# en los resultados, ni en la auditoria, ni en el paquete de entrega.
#
# Sobreescrituras por entorno (mismas reglas, sin tocar el fichero):
#   PUNTO_ARCHITECT_PROVIDER, PUNTO_BUILDER_PROVIDER, PUNTO_VISUAL_QA_PROVIDER
#   PUNTO_OPENAI_MODEL, PUNTO_DEEPSEEK_MODEL, PUNTO_ANTHROPIC_MODEL
#   PUNTO_OPENAI_TRANSPORT, PUNTO_ANTHROPIC_TRANSPORT, PUNTO_DEEPSEEK_TRANSPORT
#   PUNTO_OPENAI_AUTH_MODE, PUNTO_ANTHROPIC_AUTH_MODE, PUNTO_DEEPSEEK_AUTH_MODE
# ============================================================================

version: "0.1.0"

providers:
  openai:
    enabled: true
    model: "gpt-5.6-sol"
    # Cliente oficial de OpenAI con la cuenta ChatGPT. Alternativa explicita: transport: "api"
    transport: "codex"
    auth_mode: "chatgpt"
  deepseek:
    enabled: true
    model: "deepseek-v4-pro"
    # Transporte existente: la API oficial con clave.
    transport: "existing"
    auth_mode: "api_key"
  anthropic:
    enabled: true
    model: "claude-sonnet-5"
    # Cliente oficial de Anthropic (Claude Code) con la cuenta Claude.
    # Alternativa explicita: transport: "api"
    transport: "claude_code"
    auth_mode: "claude_account"

roles:
  ARCHITECT: openai
  BUILDER: deepseek
  VISUAL_QA: anthropic

failover:
  allow_metered: false
  max_substitutes: 2
  roles:
    # ARCHITECT: primario openai (Codex, cuenta ChatGPT con limite de uso). Si el cliente oficial
    # declara el limite agotado (LIMIT_REACHED) o no esta operativo, continua con Claude por su
    # cuenta (suscripcion): Planning solo necesita salida de texto/JSON, no vision.
    ARCHITECT: [anthropic]
    # BUILDER: primario deepseek (API de pago). Si se queda sin creditos, continua con Claude por su
    # cuenta (suscripcion), en el orden declarado.
    BUILDER: [anthropic]
    # VISUAL_QA: primario anthropic (Claude Code, solo texto: sin imagenes efectivas). Cuando una
    # peticion lleva imagenes se elige por capacidad EFECTIVA: Codex (cuenta ChatGPT) si su binario
    # anuncia --image. Claude BUILDER sigue siendo solo texto y sin herramientas.
    VISUAL_QA: [openai]

# TAKEOVER de calidad: independiente de `failover` (arriba). `failover` es para cuando el
# primario NO PUEDE responder (cuota, limite de tasa, desconexion); `takeover` es para cuando SI
# respondio pero el resultado no resuelve la causa (CHANGES_EMPTY ante un criterio FAILED con
# remedio accionable, una reparacion causal no resuelta). Comparten el mismo evaluador de
# capacidad/conexion, pero la prioridad de recuperacion puede -y aqui debe- ser distinta.
takeover:
  allow_metered: false
  max_substitutes: 2
  roles:
    # Politica de PUNTO: Codex es el proveedor prioritario de recuperacion de calidad para
    # fallos causales de OTROS modelos (DeepSeek, Claude, futuros) -- Codex sigue siendo el
    # ARCHITECT principal; esto es solo una autorizacion para tomar temporalmente el trabajo de
    # BUILDER cuando el primario respondio sin resolver la causa. Si Codex no esta disponible,
    # continua con el siguiente candidato autorizado y capaz (Claude).
    BUILDER: [openai, anthropic]

# RECOVERY operacional (Fase 8A): independiente de `failover` y de `takeover`. `failover` y
# `takeover` dan por hecho que DeepSeek sigue siendo el primario de BUILDER y listan solo su(s)
# sustituto(s); `recovery` en cambio es el orden general de rotacion cuando CUALQUIERA de los
# tres providers de BUILDER (incluido el propio primario) sufre un fallo OPERACIONAL real
# (auth/cuota/rate-limit/transporte/no-disponible) a mitad de un ciclo ya en marcha -- el
# provider que causo el fallo se excluye SIEMPRE, sea cual sea; el resto de este orden general
# se evalua tal cual. No es sustituto de `failover` (que sigue gobernando el primer intento) ni
# de `takeover` (calidad, no disponibilidad): es la tercera causa, ver
# punto.providers.recovery_policy.
recovery:
  allow_metered: false
  max_substitutes: 2
  roles:
    BUILDER: [openai, anthropic, deepseek]
