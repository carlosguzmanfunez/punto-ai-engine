[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "punto-ai-engine"
version = "0.1.0"
description = "PUNTO AI ENGINE - Núcleo constitucional determinista (Base Constitucional V0.1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Punto Inmobiliario HN" }]
keywords = ["ai-engine", "constitution", "policy", "deterministic", "camus"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "PyYAML>=6.0.1",
  # ENGINE-2: cliente HTTP propio para la API de DeepSeek (sin SDK de terceros).
  "httpx>=0.27",
  # DB AUTHORITY v0: driver PostgreSQL del CONTROLADOR. El motor ejecuta SQL; el proyecto
  # sigue usando su propio ORM (Drizzle). El BUILDER y el sandbox no confiable nunca lo ven.
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0.12",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# El live gate de DeepSeek vive en tests/integration y se ejecuta aparte:
# hace llamadas reales a la API, que no deben correr en cada suite.
addopts = "-ra --strict-markers --strict-config --ignore=tests/integration"
markers = [
  "integration: pruebas que dependen de un servicio externo real (DeepSeek API)",
]
# Las advertencias se tratan como errores, con una única excepción explícita:
# la deprecación de Starlette sobre `httpx` en su TestClient, que no depende de
# este proyecto y no afecta al comportamiento del motor.
filterwarnings = [
  "error",
  # Las dependencias de terceros (Starlette/AnyIO) emiten avisos de deprecación
  # que no dependen de este proyecto. Se ignoran para poder tratar como errores
  # las advertencias que sí genera el propio motor.
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  # Los modelos Pydantic usan nombres como `model_config`; no aplica.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
# Los decoradores de ruta de FastAPI (@app.get) no están tipados de forma
# completa; se relaja ÚNICAMENTE esta comprobación, no el tipado de los cuerpos.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["punto"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
